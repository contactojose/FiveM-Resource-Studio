
name: Build FiveM Resource Studio

on:
  workflow_dispatch:
  push:
    branches: [principal]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Python para compilación
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Crear ejecutable
        run: |
          pyinstaller --noconfirm --clean --windowed --name FiveM_Resource_Studio FiveM_Resource_Studio.py

      - name: Compilar instalador
        run: |
          choco install innosetup --no-progress -y
          iscc FiveM_Resource_Studio_Setup.iss

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: FiveM-Resource-Studio-Windows-Installer
          path: installer/FiveM_Resource_Studio_Setup_Windows_x64.exe
